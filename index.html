
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b090c">
<title>A Little Story For You</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b090c;
--rose:#c98e9e;
--rose2:#e2b6c0;
--gold:#b99770;
--cream:#f5e9e9;
--muted:#aa969f
}

*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:var(--bg);
color:var(--cream)
}

body{
font-family:'Cormorant Garamond',serif;
overflow:hidden
}

button,input{font:inherit}

#app{
min-height:100svh;
position:relative;
isolation:isolate;
overflow:hidden;
background:radial-gradient(ellipse at 50% 44%,#24151e 0%,#120e14 42%,#09080b 100%)
}

#app:before,#app:after{
content:"";
position:absolute;
inset:15px;
border:1px solid rgba(201,142,158,.14);
pointer-events:none;
z-index:-1
}

#app:after{
inset:22px;
border-color:rgba(185,151,112,.10)
}

.ambient{
position:absolute;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1
}

.spark{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#e8c8ce;
opacity:.45;
box-shadow:0 0 9px 2px #c98e9e;
animation:twinkle 4s ease-in-out infinite
}

@keyframes twinkle{
0%,100%{opacity:.12;transform:scale(.7)}
50%{opacity:.8;transform:scale(1.6)}
}

.scene{
min-height:100svh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
padding:clamp(38px,7vh,72px) 32px max(35px,env(safe-area-inset-bottom));
text-align:center;
opacity:1;
transition:opacity .45s ease,transform .45s ease;
position:relative
}

.scene.leaving{
opacity:0;
transform:translateY(12px)
}

.topline{
font:500 9px Inter,sans-serif;
letter-spacing:.32em;
text-transform:uppercase;
color:#a98591
}

.counter{
font:400 10px Inter,sans-serif;
letter-spacing:.15em;
color:#76616b;
margin-top:12px
}

.middle{
width:min(100%,650px);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:20px;
margin:auto 0;
padding:36px 0
}

.ornament{
width:min(230px,65vw);
height:52px;
color:var(--gold);
opacity:.85
}

.ornament.bottom{transform:rotate(180deg)}

.story{
font-size:clamp(32px,7.8vw,57px);
line-height:1.17;
font-weight:500;
letter-spacing:.005em;
color:var(--cream);
max-width:650px;
text-wrap:balance;
min-height:1.2em
}

.story.script{
font-family:'Cormorant Garamond',serif;
font-size:clamp(36px,8vw,62px);
font-weight:600;
color:var(--rose2);
line-height:1.15;
letter-spacing:.01em
}

.story .rose{
color:var(--rose2);
font-style:italic
}

.expression{
font-size:clamp(52px,13vw,84px);
line-height:1;
filter:drop-shadow(0 0 18px rgba(201,142,158,.2));
animation:pop .65s cubic-bezier(.2,.8,.2,1) both
}

@keyframes pop{
0%{transform:scale(.5) rotate(-9deg);opacity:0}
75%{transform:scale(1.12) rotate(3deg)}
100%{transform:scale(1);opacity:1}
}

.subtle{
font-size:19px;
color:var(--muted);
font-style:italic
}

.controls{
width:min(100%,380px);
display:flex;
flex-direction:column;
align-items:center;
gap:14px
}

.btn{
border:1px solid rgba(201,142,158,.65);
border-radius:999px;
padding:13px 25px;
background:linear-gradient(135deg,rgba(201,142,158,.22),rgba(185,151,112,.12));
color:#f6dfe5;
font:500 11px Inter,sans-serif;
letter-spacing:.16em;
text-transform:uppercase;
cursor:pointer;
min-width:190px;
transition:.2s
}

.btn:hover{
background:rgba(201,142,158,.3);
transform:translateY(-2px);
box-shadow:0 7px 30px #c98e9e22
}

.btn.secondary{
background:transparent;
border-color:rgba(201,142,158,.25);
color:#aa929c;
min-width:110px;
padding:9px 18px;
font-size:10px
}

.btn:focus-visible,input:focus-visible{
outline:2px solid var(--rose2);
outline-offset:4px
}

.tap{
font:10px Inter,sans-serif;
letter-spacing:.16em;
text-transform:uppercase;
color:#816d76;
animation:pulse 2.2s infinite
}

@keyframes pulse{50%{opacity:.45}}

.name-form{
display:flex;
gap:9px;
width:min(100%,370px);
margin-top:4px
}

.name-form input{
min-width:0;
flex:1;
background:#171118;
border:1px solid #76505f;
border-radius:999px;
padding:13px 17px;
color:#f8e9ed;
font:16px Inter,sans-serif;
text-align:center
}

.name-form button{
min-width:85px;
padding:10px 15px
}

.answer{
display:flex;
flex-direction:column;
align-items:center;
gap:12px
}

.footer{
font:9px Inter,sans-serif;
letter-spacing:.22em;
color:#66535d;
text-transform:uppercase
}

.progress{
position:absolute;
top:0;
left:0;
height:2px;
background:linear-gradient(90deg,var(--rose),var(--gold));
transition:width .35s
}

.music-toggle{
position:absolute;
right:35px;
top:35px;
border:1px solid #75546266;
background:#120e14aa;
color:#b994a1;
border-radius:50%;
width:36px;
height:36px;
font:15px Inter;
cursor:pointer;
z-index:5
}

@media(max-height:650px){
.scene{padding-top:28px;padding-bottom:25px}
.middle{gap:12px;padding:15px 0}
.ornament{height:30px}
.story{font-size:clamp(28px,6vw,44px)}
.story.script{font-size:52px}
.expression{font-size:55px}
}

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
transition-duration:.01ms!important
}
}
</style>
</head>

<body>

<div id="app">

<div class="ambient" id="ambient"></div>
<div class="progress" id="progress"></div>

<button class="music-toggle" id="musicToggle"
aria-label="Toggle background music"
title="Toggle music">♫</button>

<main class="scene" id="scene" aria-live="polite">

<div>
<div class="topline">A little story for you</div>
<div class="counter" id="counter">01 / 15</div>
</div>

<div class="middle" id="middle"></div>

<div class="controls" id="controls"></div>

<div class="footer">✦ written with a little love ✦</div>

</main>
</div>

<!-- Background music -->
<audio id="backgroundMusic" loop preload="auto">
<source src="song.mp3" type="audio/mpeg">
</audio>

<script>
(() => {

const $ = id => document.getElementById(id);

const scene = $('scene');
const middle = $('middle');
const controls = $('controls');
const counter = $('counter');
const progress = $('progress');

let index = 0;
let typingTimer = null;
let musicOn = false;

const music = $('backgroundMusic');
music.volume = 0.2;

const total = 15;

// Story scenes
const scenes = [

{
text:'Can I tell you a story?',
face:'🥺',
buttons:[
['YES, TELL ME ❤️',()=>go(1)],
['No 😒',()=>go(0,'plea')]
]
},

{text:'There is this beautiful, amazing girl...',face:'🌹',next:2},

{text:'Her name is Chechemo.',face:'💗',next:3},

{text:'And Chechemo is MIIIIINE!',face:'😏',next:4,emphasis:true},

{text:'Sorry... where was I?',face:'😇',next:5},

{text:'Yeah. This girl...',face:'❤️',next:6},

{text:'Sometimes she can be crazy...',face:'🤪',next:7},

{text:'Sometimes she can be so, so sweet.',face:'🥰',next:8},

{text:'Oh, and her man misses her sooo much.',face:'🥺',next:9},

{text:'Oh, and her man loves eating meat.',face:'😅',next:10},

{text:'Right now, her man wants to hug her...',face:'🫂',next:11},

{text:'...and fall asleep in her arms, on her KIFUAAAAAA!',face:'🙈',next:12,emphasis:true},

{text:'Sorry.',face:'🥹',next:13},

{text:'Weeeee! Story imeisha!',face:'😂',next:14},

{text:'Ru o lakwani...',face:'❤️',next:15,slow:true}

];

function makeStars(){

for(let i=0;i<34;i++){

const s=document.createElement('i');

s.className='spark';
s.style.left=(Math.random()*100)+'%';
s.style.top=(Math.random()*100)+'%';
s.style.animationDelay=(Math.random()*4)+'s';
s.style.animationDuration=(3+Math.random()*4)+'s';

$('ambient').appendChild(s);

}

}

function ornament(){

return `<svg class="ornament" viewBox="0 0 260 55" fill="none" aria-hidden="true">

<path d="M4 28 C38 2 55 52 91 28 S129 5 130 27 S170 52 207 28 S240 7 256 28"
stroke="currentColor" stroke-width="1"/>

<path d="M130 27 C111 4 101 23 130 43 C159 23 149 4 130 27Z"
stroke="currentColor" stroke-width="1"/>

<path d="M18 24 Q28 10 38 23 M222 23 Q232 10 242 24"
stroke="currentColor" stroke-width="1"/>

<circle cx="130" cy="27" r="2" fill="currentColor"/>

</svg>`;

}

function typeText(el,text,speed=48,done=()=>{}){

clearInterval(typingTimer);

el.textContent='';
let n=0;

typingTimer=setInterval(()=>{

el.textContent=text.slice(0,n++);

if(n>text.length){

clearInterval(typingTimer);
typingTimer=null;
done();

}

},speed);

}

function addNextButton(next,label='CONTINUE →'){

const b=document.createElement('button');

b.className='btn';
b.textContent=label;
b.onclick=()=>go(next);

controls.appendChild(b);

const hint=document.createElement('div');

hint.className='tap';
hint.textContent='take your time';

controls.appendChild(hint);

}

function render(which,branch){

clearInterval(typingTimer);

index=which;

const item=branch==='plea'
?{
text:'Pleaaaaase! 🥺',
face:'👉👈',
next:1,
script:true,
sub:'Just one little story...'
}
:scenes[which];

if(!item)return;

counter.textContent=
String(Math.min(which+1,total)).padStart(2,'0')
+' / '+
String(total).padStart(2,'0');

progress.style.width=
(Math.min(which+1,total)/total*100)+'%';

middle.innerHTML='';
controls.innerHTML='';

middle.insertAdjacentHTML('beforeend',ornament());

const text=document.createElement('div');

text.className='story'+(item.script?' script':'');

middle.appendChild(text);

if(item.face){

const face=document.createElement('div');

face.className='expression';
face.textContent=item.face;

middle.appendChild(face);

}

if(item.sub){

const sub=document.createElement('div');

sub.className='subtle';
sub.textContent=item.sub;

middle.appendChild(sub);

}

middle.insertAdjacentHTML(
'beforeend',
ornament().replace(
'class="ornament"',
'class="ornament bottom"'
)
);

// Stop music as soon as the final scene is reached
if(item.slow){

music.pause();
music.currentTime=0;
musicOn=false;
$('musicToggle').textContent='♫̸';

}

// Typewriter effect
typeText(
text,
item.text,
item.slow?150:(item.script?58:48),
()=>{

if(item.buttons){

item.buttons.forEach(([label,action])=>{

const b=document.createElement('button');

b.className='btn'+
(label.startsWith('No')?' secondary':'');

b.textContent=label;
b.onclick=action;

controls.appendChild(b);

});

}

else if(item.next!==undefined && which!==scenes.length-1){

addNextButton(item.next);

}

}
);

// Final scene: slower typing, no replay button
if(item.slow){

typeText(text,item.text,150,()=>{

const end=document.createElement('div');

end.className='subtle';
end.textContent='(x0.5)';

controls.appendChild(end);

});

}

}

function go(next,branch){

scene.classList.add('leaving');

setTimeout(()=>{

render(next,branch);
scene.classList.remove('leaving');

},260);

}

// Background music
async function startMusic(){

try{

await music.play();

musicOn=true;
$('musicToggle').textContent='♫';

}catch(error){

musicOn=false;

}

}

// Attempt autoplay when the website loads
window.addEventListener('load',()=>{

startMusic();

});

// Start music on first interaction if autoplay was blocked
document.addEventListener('click',()=>{

if(!musicOn){

startMusic();

}

},{once:true});

// Music toggle button
$('musicToggle').addEventListener('click',async()=>{

if(!music.paused){

music.pause();
musicOn=false;
$('musicToggle').textContent='♫̸';

}else{

await startMusic();

}

});

makeStars();
render(0);

})();
</script>

</body>
  </html>
